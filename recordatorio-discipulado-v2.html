<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recordatorio · La Serie 2:7 — Comienza el discipulado (v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F2E9;--paper-2:#FBF8F1;--ink:#22282A;--ink-soft:#565E5B;--ink-faint:#8C938E;
    --teal:#1E5B57;--teal-bright:#2E837B;--teal-wash:#E7EEEB;--gold:#B0894E;
    --line:rgba(30,91,87,.22);--line-soft:rgba(34,40,42,.12);
    --serif:'Spectral',Georgia,serif;--sans:'Libre Franklin',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:var(--sans);color:var(--ink);background:#cfcabd;
    -webkit-font-smoothing:antialiased;padding:24px;
  }

  /* lienzo 16:9 — 1280 × 720 */
  .slide{
    position:relative;width:1280px;height:720px;background:var(--paper);
    box-shadow:0 22px 60px rgba(0,0,0,.28);overflow:hidden;
    padding:56px 92px;display:flex;flex-direction:column;align-items:center;text-align:center;
    transform-origin:center center;
  }
  .slide::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(900px 520px at 110% -10%, rgba(46,131,123,.10), transparent 60%),
      radial-gradient(760px 480px at -12% 120%, rgba(176,137,78,.10), transparent 60%);
  }
  .slide > *{position:relative}

  /* logo arriba al centro */
  .logo{width:150px;height:auto;display:block}

  .eyebrow{margin-top:24px;font-size:13px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--teal)}
  .eyebrow::before,.eyebrow::after{content:"·";color:var(--gold);margin:0 .7em}

  h1{font-family:var(--serif);font-weight:500;font-size:72px;line-height:1.02;color:var(--ink);margin-top:14px}

  /* regla dorada decorativa */
  .ornament{width:70px;height:2px;background:var(--gold);margin:26px 0}

  .verse{font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.5;
    color:var(--ink-soft);max-width:46ch}
  .verse cite{display:block;font-style:normal;font-weight:600;font-size:12px;letter-spacing:.06em;
    color:var(--teal);margin-top:12px;text-transform:uppercase}

  /* franja horizontal de fecha · hora · lugar */
  .meta{margin-top:auto;display:flex;align-items:stretch;gap:0;
    border-top:2px solid var(--teal);padding-top:26px;width:100%;max-width:760px}
  .meta .cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 18px}
  .meta .cell + .cell{border-left:1px solid var(--line)}
  .meta .lbl{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint)}
  .meta .big{font-family:var(--serif);font-weight:600;font-size:30px;color:var(--teal);line-height:1.05}
  .meta .sub{font-size:14px;color:var(--ink-soft)}

  @media print{
    @page{size:13.333in 7.5in;margin:0}
    body{background:#fff;padding:0}
    .slide{box-shadow:none;transform:none!important}
  }
</style>
</head>
<body>
  <div class="slide" id="slide">
    <img class="logo" src="logo-2-7.webp" alt="Colossians 2:7 Series">

    <div class="eyebrow">Comienza el discipulado</div>
    <h1>Sesión Uno</h1>

    <div class="ornament"></div>

    <p class="verse">
      «Arráiguense profundamente en él y edifiquen toda la vida sobre él.»
      <cite>Colosenses 2:7 · NTV</cite>
    </p>

    <div class="meta">
      <div class="cell">
        <span class="lbl">Fecha</span>
        <span class="big">8 de julio</span>
        <span class="sub">Miércoles</span>
      </div>
      <div class="cell">
        <span class="lbl">Hora</span>
        <span class="big">8:00 p.&nbsp;m.</span>
        <span class="sub">Hora local</span>
      </div>
      <div class="cell">
        <span class="lbl">Dónde</span>
        <span class="big">Zoom</span>
        <span class="sub">Grupo virtual</span>
      </div>
    </div>
  </div>

  <script>
    const slide = document.getElementById("slide");
    function fit(){
      const margin = 48;
      const s = Math.min((window.innerWidth - margin) / 1280, (window.innerHeight - margin) / 720, 1);
      slide.style.transform = "scale(" + s + ")";
    }
    fit();
    window.addEventListener("resize", fit);
  </script>
</body>
</html>
